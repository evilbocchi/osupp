name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun test

  release:
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: Create release
        id: create_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(date -u +'%Y%m%d-%H%M%S')-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "Release $tag" \
            --generate-notes
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Upload binaries to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.create_release.outputs.tag }}
        run: |
          shopt -s nullglob
          assets=(dist/*)
          if ((${#assets[@]})); then
            zip -r dist.zip "${assets[@]}"
            gh release upload "$TAG" dist.zip
          else
            echo "No build artifacts found in dist/ to upload"
          fi
